services:
  nginx-autohandler:
    build: .
    image: nginx-autohandler:local
    restart: unless-stopped
    # The default bridge avoids creating a new Docker network, which fails when address pools are full.
    network_mode: bridge
    ports:
      - "80:80"
      - "443:443"
      # Editor UI on host port 8090 (8080 is taken on this PC). Put your TLS reverse proxy in front.
      - "8090:8080"
    # Every setting below is optional. A non-empty value here locks that setting in the UI.
    # Leave them empty to set things from the Settings dialog instead.
    environment:
      UI_USER: ${UI_USER:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_PROXIED: ${CLOUDFLARE_PROXIED:-}
      CLOUDFLARE_IP_SYNC: ${CLOUDFLARE_IP_SYNC:-}
      CLOUDFLARE_DNS_FROM_CONFIGS: ${CLOUDFLARE_DNS_FROM_CONFIGS:-}
      CLOUDFLARE_CHECK_INTERVAL_SECONDS: ${CLOUDFLARE_CHECK_INTERVAL_SECONDS:-}
      CLOUDFLARE_DOMAINS: ${CLOUDFLARE_DOMAINS:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      NGINX_AUTO_RELOAD: ${NGINX_AUTO_RELOAD:-}
      NGINX_AUTOHANDLER_BACKUP_KEEP: ${NGINX_AUTOHANDLER_BACKUP_KEEP:-}
    volumes:
      - ./data/nginx:/etc/nginx
      - ./data/ui:/var/lib/nginx-autohandler
      - ./data/certs:/etc/letsencrypt
