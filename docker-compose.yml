services:
  nginx-autohandler:
    build: .
    image: nginx-autohandler:local
    restart: unless-stopped
    # The default bridge avoids creating a new Docker network, which fails when address pools are full.
    network_mode: bridge
    ports:
      - "80:80"
      - "443:443"
      # Editor UI on host port 8090 (8080 is taken on this PC). Put your TLS reverse proxy in front.
      - "8090:8080"
    # Every setting below is optional. A non-empty value here locks that setting in the UI.
    # Leave them empty to set things from the Settings dialog instead.
    environment:
      UI_USER: ${UI_USER:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-}
      CLOUDFLARE_DOMAINS: ${CLOUDFLARE_DOMAINS:-}
      TZ: ${TZ:-}
      UI_BIND: ${UI_BIND:-}
      AUTOHANDLER_DISABLED: ${AUTOHANDLER_DISABLED:-}
      NGINX_EXIT_ON_FAILURE: ${NGINX_EXIT_ON_FAILURE:-}
      NGINX_LOG_ROTATE_BYTES: ${NGINX_LOG_ROTATE_BYTES:-}
      # Cloudflare
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_PROXIED: ${CLOUDFLARE_PROXIED:-}
      CLOUDFLARE_IP_SYNC: ${CLOUDFLARE_IP_SYNC:-}
      CLOUDFLARE_MOVE_OLD_IP_RECORDS: ${CLOUDFLARE_MOVE_OLD_IP_RECORDS:-}
      CLOUDFLARE_DNS_FROM_CONFIGS: ${CLOUDFLARE_DNS_FROM_CONFIGS:-}
      CLOUDFLARE_CHECK_INTERVAL_SECONDS: ${CLOUDFLARE_CHECK_INTERVAL_SECONDS:-}
      RETRY_INTERVAL_SECONDS: ${RETRY_INTERVAL_SECONDS:-}
      # Public IP lookup
      WHOAMI_URLS: ${WHOAMI_URLS:-}
      OVERRIDE_OBSOLETE_WHOAMI: ${OVERRIDE_OBSOLETE_WHOAMI:-}
      ENFORCE_DNS_RESOLUTION: ${ENFORCE_DNS_RESOLUTION:-}
      TEST_URL_CONNECTIVITY: ${TEST_URL_CONNECTIVITY:-}
      ENFORCE_URL_CONNECTIVITY: ${ENFORCE_URL_CONNECTIVITY:-}
      ENFORCE_URL_VALIDITY: ${ENFORCE_URL_VALIDITY:-}
      IP_CHANGE_CONFIRM_SECONDS: ${IP_CHANGE_CONFIRM_SECONDS:-}
      INITIAL_IP: ${INITIAL_IP:-}
      # Certificates
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_PROVIDER: ${ACME_PROVIDER:-}
      ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-}
      ACME_EAB_KID: ${ACME_EAB_KID:-}
      ACME_EAB_HMAC_KEY: ${ACME_EAB_HMAC_KEY:-}
      ACME_DNS_PROVIDER: ${ACME_DNS_PROVIDER:-}
      ACME_STAGING: ${ACME_STAGING:-}
      EXTERNAL_CERT_DIRS: ${EXTERNAL_CERT_DIRS:-}
      CERT_RENEW_DAYS: ${CERT_RENEW_DAYS:-}
      CERT_EXPIRY_WARN_DAYS: ${CERT_EXPIRY_WARN_DAYS:-}
      # Git sync
      GIT_REPO_URL: ${GIT_REPO_URL:-}
      GIT_BRANCH: ${GIT_BRANCH:-}
      GIT_SUBDIR: ${GIT_SUBDIR:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_MODE: ${GIT_MODE:-}
      GIT_INTERVAL_MINUTES: ${GIT_INTERVAL_MINUTES:-}
      GIT_CONFLICTS: ${GIT_CONFLICTS:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      # Email (SMTP)
      SMTP_ENABLED: ${SMTP_ENABLED:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_TLS_SERVER_NAME: ${SMTP_TLS_SERVER_NAME:-}
      SMTP_VERIFY_TLS: ${SMTP_VERIFY_TLS:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_UNSUBSCRIBE: ${SMTP_UNSUBSCRIBE:-}
      SMTP_PRECEDENCE: ${SMTP_PRECEDENCE:-}
      SMTP_RETRIES: ${SMTP_RETRIES:-}
      SMTP_RETRY_DELAY: ${SMTP_RETRY_DELAY:-}
      # Discord
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_USERNAME: ${DISCORD_USERNAME:-}
      DISCORD_PING: ${DISCORD_PING:-}
      DISCORD_BOLD: ${DISCORD_BOLD:-}
      DISCORD_PREFIX_HEADER: ${DISCORD_PREFIX_HEADER:-}
      USE_EMBEDS: ${USE_EMBEDS:-}
      # Nginx
      NGINX_AUTO_RELOAD: ${NGINX_AUTO_RELOAD:-}
      WATCH_CONFIG: ${WATCH_CONFIG:-}
      SEND_DIFF: ${SEND_DIFF:-}
      DIFF_CONTEXT: ${DIFF_CONTEXT:-}
      INCLUDE_HOSTNAME: ${INCLUDE_HOSTNAME:-}
      CUSTOM_HOSTNAME: ${CUSTOM_HOSTNAME:-}
      NGINX_AUTOHANDLER_BACKUP_KEEP: ${NGINX_AUTOHANDLER_BACKUP_KEEP:-}
      # General
      SERVICE_NAME: ${SERVICE_NAME:-}
      DISABLE_WELCOME_EMAIL: ${DISABLE_WELCOME_EMAIL:-}
      DISABLE_RESTART_EMAIL: ${DISABLE_RESTART_EMAIL:-}
      TIME_DISPLAY: ${TIME_DISPLAY:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      MAX_LOG_BYTES: ${MAX_LOG_BYTES:-}
      ENABLE_COLORED_LOGGING: ${ENABLE_COLORED_LOGGING:-}
    volumes:
      - ./data/nginx:/etc/nginx
      - ./data/ui:/var/lib/nginx-autohandler
      - ./data/certs:/etc/letsencrypt
      - ./data/logs:/var/log/nginx
      # Certificates managed elsewhere (read-only): drop folders in ./data/external-certs, or point this at your own path.
      # They are listed in the Certificates dialog and nginx can use them from /certs/<name>/fullchain.pem.
      - ./data/external-certs:/certs:ro
